# Paths (Local defaults, can be overridden in Kaggle)
paths:
  input_dir: "data/raw"
  output_dir: "data/processed"
  csv_name: "metadata.csv"

# Audio Preprocessing
audio:
  target_sr: 16000
  chunk_duration: 3.0
  step_duration: 1.5
  trim_top_db: 20

# Feature Extraction (Log-Mel Spectrogram)
features:
  n_fft: 1024
  hop_length: 512
  n_mels: 128

# Training parameters (We will use these later)
training:
  batch_size: 64
  epochs: 5
  learning_rate: 0.001
  num_workers: 2
